[project]
name = "sovereign-guard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "sovereign-shared",
]

[tool.uv.sources]
sovereign-shared = { path = "../../packages/shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
